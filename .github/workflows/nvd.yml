name: Update vuln-list-nvd repo
on:
  schedule:
  - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update vuln-list-nvd
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VULN_LIST_DIR: "vuln-list-nvd"
    steps:
    - name: Check out code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        go-version-file: go.mod

    - name: Check out vuln-list-nvd repo
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        repository: ${{ github.repository_owner }}/${{ env.VULN_LIST_DIR }}
        path: ${{ env.VULN_LIST_DIR }}
        persist-credentials: false # update-source action mints a fresh token per push

    - name: Setup github user email and name
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Compile vuln-list-update
      run: go build -o vuln-list-update .

    - if: always()
      name: NVD
      run: exit 1 # TEST: force failure to trigger Slack notification

    - name: Slack Notification
      uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
      if: failure()
      with:
        webhook: ${{ secrets.TRIVY_SLACK_WEBHOOK }}
        webhook-type: incoming-webhook
        payload: |
          text: ":x: *${{ github.workflow }}* workflow failed — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"